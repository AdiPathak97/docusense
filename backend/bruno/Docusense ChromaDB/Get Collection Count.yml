info:
  name: Get Collection Count
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8000/api/v1/collections/{{collection_id}}/count
  auth: inherit

runtime:
  variables:
    - name: collection_id
      value: 470b5524-8b4f-481c-8700-3054ce6b50ca

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
